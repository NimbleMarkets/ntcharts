name: Build Go

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.26"

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Test the project
        run: task test

      - name: Build the project
        run: task build

      - name: Verify module publishing and consumer builds
        run: task check-release

      - name: Test release workflow regressions
        run: ./scripts/test-release.sh
