name: Build Go

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.25"

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Test the project
        run: task test

      - name: Build the project
        run: task build
